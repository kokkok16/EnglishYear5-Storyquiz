        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'english-y5-story-quiz';

        let db = null;
        let auth = null;

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                console.log("Firebase Auth & Firestore Connected Successfully!");
            } catch (err) {
                console.warn("Firestore initialization error:", err.message);
            }
        }

        window.saveQuizToCloud = async function(studentData) {
            if (!db || !auth || !auth.currentUser) return;
            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'student_results');
                await addDoc(colRef, {
                    ...studentData,
                    timestamp: serverTimestamp()
                });
                console.log("Result successfully saved to Firestore.");
            } catch (e) {
                console.error("Failed to save to Firestore:", e);
            }
        };

        window.fetchCloudRecords = async function() {
            if (!db || !auth || !auth.currentUser) return [];
            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'student_results');
                const snapshot = await getDocs(colRef);
                const results = [];
                snapshot.forEach(doc => {
                    results.push({ id: doc.id, ...doc.data() });
                });
                return results;
            } catch (e) {
                console.error("Failed to fetch cloud records:", e);
                return [];
            }
        };

        initFirebase();
    </script>

        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playClick() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playCorrect() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.4);
            }

            playWrong() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.setValueAtTime(180, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.3);
            }

            playFinish() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [400, 523, 659, 783, 1046].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.12, now + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Slow English speech

        function renderStep() {
            const container = document.getElementById('app-container');
            const counterEl = document.getElementById('step-counter');
            const progressEl = document.getElementById('quiz-progress-bar');

            if (!container) return;

            // Update Progress Bar & Counter
            const current = quizState.currentStep;
            counterEl.textContent = `Step ${current + 1} of 12`;
            const percent = Math.min(100, Math.round((current / 11) * 100));
            progressEl.style.width = `${percent}%`;

            container.classList.remove('fade-in-slide');
            void container.offsetWidth; // Trigger reflow for animation reset
            container.classList.add('fade-in-slide');

            if (current === 0) {
                renderStudentInfoStep(container);
            } else if (current >= 1 && current <= 10) {
                renderQuestionStep(container, current - 1);
            } else {
                renderSummaryStep(container);
            }
        }

                        <div class="flex items-center gap-2.5">
                            <div class="p-2 bg-purple-600 text-white rounded-lg shadow-sm">
                                <i class="fa-solid fa-user-shield text-sm"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-slate-800">我是教师 / Teacher Access</h4>
                                <p class="text-[11px] text-slate-500">无需输入学生资料，点击直接输入密码进入后台查看成绩</p>
                            </div>
                        </div>
                        <button type="button" onclick="openTeacherModal()" class="px-3 py-1.5 bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold rounded-lg shadow transition flex items-center gap-1 flex-shrink-0">
                            <i class="fa-solid fa-key text-[10px]"></i>
                            <span>教师专区</span>
                        </button>
                    </div>

                    <div class="border-b border-slate-200 pb-4">
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-user-graduate text-purple-600"></i> Student Registration / 学生登录
                        </h2>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1">
                            请填写英文姓名与指定后缀的 Email 账号以开启练习。
                        </p>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label for="input-name" class="block text-sm font-semibold text-slate-700 mb-1">
                                Student English Name / 英文姓名 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="input-name" value="${quizState.studentName}" 
                                   placeholder="e.g. Tan Ah Kow" 
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200 text-sm transition">
                            <p id="error-name" class="hidden text-xs text-red-600 mt-1">请输入你的英文名字 (只允许英文字母与空格)。</p>
                        </div>

                        <div>
                            <label for="input-email" class="block text-sm font-semibold text-slate-700 mb-1">
                                MOE Email / IDME 账号 <span class="text-red-500">*</span>
                            </label>
                            <input type="email" id="input-email" value="${quizState.studentEmail}" 
                                   placeholder="例如: g-12345678@moe-dl.edu.my" 
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200 text-sm transition">
                            <p id="error-email" class="hidden text-xs text-red-600 mt-1 font-semibold">
                                ❌ 邮箱格式错误！必须以 <code class="bg-red-100 text-red-800 px-1 py-0.5 rounded">@moe-dl.edu.my</code> 结尾 (例如 g-xxxx@moe-dl.edu.my)。
                            </p>
                        </div>
                    </div>

                    <div class="pt-2 flex justify-end">
                        <button type="button" onclick="startQuiz()" class="w-full sm:w-auto px-8 py-3.5 bg-purple-700 hover:bg-purple-800 text-white font-bold text-sm rounded-xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2">
                            <span>Start Quiz / 开始答题</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function startQuiz() {
            const nameInput = document.getElementById('input-name');
            const emailInput = document.getElementById('input-email');
            const errName = document.getElementById('error-name');
            const errEmail = document.getElementById('error-email');

            const nameVal = nameInput.value.trim();
            const emailVal = emailInput.value.trim().toLowerCase();

            let valid = true;

            // English Name Validation
            const englishNameRegex = /^[A-Za-z\s'-]+$/;
            if (!nameVal || !englishNameRegex.test(nameVal)) {
                errName.classList.remove('hidden');
                nameInput.classList.add('border-red-500');
                valid = false;
            } else {
                errName.classList.add('hidden');
                nameInput.classList.remove('border-red-500');
            }

            // Email Validation @moe-dl.edu.my
            const mandatorySuffix = "@moe-dl.edu.my";
            if (!emailVal || !emailVal.endsWith(mandatorySuffix) || emailVal.length <= mandatorySuffix.length) {
                errEmail.classList.remove('hidden');
                emailInput.classList.add('border-red-500');
                valid = false;
            } else {
                errEmail.classList.add('hidden');
                emailInput.classList.remove('border-red-500');
            }

            if (!valid) {
                soundFX.playWrong();
                return;
            }

            soundFX.playClick();
            quizState.studentName = nameVal;
            quizState.studentEmail = emailVal;
            quizState.currentStep = 1;
            renderStep();
        }

        function renderQuestionStep(container, qIndex) {
            const q = quizQuestions[qIndex];
            const isConfirmed = quizState.confirmedAnswers[qIndex];
            const selectedOptIndex = quizState.userAnswers[qIndex];

            let vocabHtml = '';
            if (q.vocab && q.vocab.length > 0) {
                vocabHtml = `
                    <div class="flex flex-wrap items-center gap-2 pt-1">
                        <span class="text-xs font-bold text-indigo-700 flex items-center gap-1">
                            <i class="fa-solid fa-language"></i> 重点词汇:
                        </span>
                        ${q.vocab.map(v => `
                            <span class="vocab-badge">
                                <strong class="text-purple-900">${v.en}</strong>
                                <span class="text-slate-500 font-normal">${v.cn}</span>
                            </span>
                        `).join('')}
                    </div>
                `;
            }

            const optionsHtml = q.options.map((opt, optIndex) => {
                let extraClasses = "border-slate-200 hover:bg-slate-50 cursor-pointer";
                let badgeHtml = "";

                if (selectedOptIndex === optIndex) {
                    extraClasses = "border-purple-600 bg-purple-50/80 font-medium";
                }

                if (isConfirmed) {
                    if (optIndex === q.answer) {
                        extraClasses = "border-green-500 bg-green-50 text-green-900 font-semibold";
                        badgeHtml = `<span class="ml-auto text-xs font-bold text-green-700 bg-green-100 px-2.5 py-1 rounded-full"><i class="fa-solid fa-check mr-1"></i> Correct Answer</span>`;
                    } else if (selectedOptIndex === optIndex && selectedOptIndex !== q.answer) {
                        extraClasses = "border-red-400 bg-red-50 text-red-800 line-through opacity-85";
                        badgeHtml = `<span class="ml-auto text-xs font-bold text-red-600 bg-red-100 px-2.5 py-1 rounded-full"><i class="fa-solid fa-xmark mr-1"></i> Your Choice</span>`;
                    } else {
                        extraClasses = "border-slate-200 opacity-60 cursor-not-allowed";
                    }
                }

                return `
                    <label class="flex items-center justify-between p-3.5 sm:p-4 rounded-xl border-2 transition ${extraClasses}"
                           ${!isConfirmed ? `onclick="selectOption(${qIndex}, ${optIndex})"` : ''}>
                        <div class="flex items-center gap-3">
                            <input type="radio" 
                                   name="q_option" 
                                   value="${optIndex}" 
                                   ${selectedOptIndex === optIndex ? 'checked' : ''}
                                   ${isConfirmed ? 'disabled' : ''}
                                   class="custom-radio">
                            <span class="text-sm sm:text-base leading-snug">${opt}</span>
                        </div>
                        ${badgeHtml}
                    </label>
                `;
            }).join('');

            let feedbackBox = '';
            if (isConfirmed) {
                const isCorrect = selectedOptIndex === q.answer;
                feedbackBox = `
                    <div class="p-4 rounded-xl ${isCorrect ? 'bg-green-50 border border-green-200 text-green-900' : 'bg-amber-50 border border-amber-200 text-amber-900'} space-y-2 fade-in-slide">
                        <div class="flex items-center gap-2 font-bold text-sm sm:text-base">
                            ${isCorrect ? 
                                `<i class="fa-solid fa-circle-check text-green-600 text-lg"></i> <span>回答正确！ (+10 分)</span>` : 
                                `<i class="fa-solid fa-circle-xmark text-red-500 text-lg"></i> <span>回答错误 (正确答案: ${q.options[q.answer]})</span>`
                            }
                        </div>
                        <p class="text-xs sm:text-sm text-slate-700 bg-white/80 p-3 rounded-lg border border-slate-200/60 leading-relaxed">
                            <strong class="text-slate-900">💡 简析 / Context:</strong> ${q.explanation}
                        </p>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="gf-card overflow-hidden">
                    <div class="story-bg-banner h-36 sm:h-44 p-6 flex flex-col justify-end text-white" 
                         style="background-image: url('${q.bgTheme}');">
                        <div class="relative z-10 flex items-center justify-between">
                            <span class="bg-black/60 border border-white/20 text-xs px-3 py-1 rounded-full font-bold backdrop-blur-md">
                                Question ${q.id} of 10
                            </span>
                            <button type="button" 
                                    onclick="speakText('${q.question.replace(/'/g, "\\'")}')" 
                                    title="Listen to Question" 
                                    class="p-2.5 bg-black/60 hover:bg-black/80 border border-white/20 text-white rounded-full transition flex items-center justify-center backdrop-blur-md">
                                <i class="fa-solid fa-volume-high text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <div class="p-6 sm:p-8 space-y-5">
                        <div class="space-y-3">
                            <h3 class="text-lg sm:text-xl font-bold text-slate-800 leading-snug">
                                ${q.id}. ${q.question}
                            </h3>
                            ${vocabHtml}
                        </div>

                        <div class="space-y-2.5">
                            ${optionsHtml}
                        </div>

                        <p id="select-warning" class="hidden text-xs font-semibold text-red-600 flex items-center gap-1">
                            <i class="fa-solid fa-triangle-exclamation"></i> 请先选择一个选项再点击确定！
                        </p>

                        ${feedbackBox}

                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
                            <button type="button" 
                                    onclick="prevStep()" 
                                    class="px-4 py-2.5 border border-slate-300 text-slate-600 hover:bg-slate-50 font-semibold text-xs sm:text-sm rounded-xl transition">
                                <i class="fa-solid fa-arrow-left mr-1"></i> Back
                            </button>

                            ${!isConfirmed ? `
                                <button type="button" 
                                        onclick="confirmAnswer(${qIndex})" 
                                        class="px-7 py-2.5 bg-purple-700 hover:bg-purple-800 text-white font-bold text-xs sm:text-sm rounded-xl shadow transition flex items-center gap-2">
                                    <span>Confirm / 确定</span>
                                    <i class="fa-solid fa-check"></i>
                                </button>
                            ` : `
                                <button type="button" 
                                        onclick="nextStep()" 
                                        class="px-7 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow transition flex items-center gap-2">
                                    <span>${qIndex === 9 ? 'Submit & View Results / 提交结果' : 'Next Question / 下一题'}</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function selectOption(qIndex, optIndex) {
            if (quizState.confirmedAnswers[qIndex]) return;
            soundFX.playClick();
            quizState.userAnswers[qIndex] = optIndex;
            
            const warning = document.getElementById('select-warning');
            if (warning) warning.classList.add('hidden');

            renderQuestionStep(document.getElementById('app-container'), qIndex);
        }

        function confirmAnswer(qIndex) {
            const selected = quizState.userAnswers[qIndex];
            if (selected === null || selected === undefined) {
                soundFX.playWrong();
                const warning = document.getElementById('select-warning');
                if (warning) warning.classList.remove('hidden');
                return;
            }

            quizState.confirmedAnswers[qIndex] = true;
            const isCorrect = selected === quizQuestions[qIndex].answer;

            if (isCorrect) {
                quizState.scores[qIndex] = 10;
                soundFX.playCorrect();
            } else {
                quizState.scores[qIndex] = 0;
                soundFX.playWrong();
            }

            renderQuestionStep(document.getElementById('app-container'), qIndex);
        }

        function prevStep() {
            if (quizState.currentStep > 0) {
                soundFX.playClick();
                quizState.currentStep--;
                renderStep();
            }
        }

        function nextStep() {
            if (quizState.currentStep <= 10) {
                soundFX.playClick();
                quizState.currentStep++;
                renderStep();
            }
        }

        function renderSummaryStep(container) {
            const totalScore = quizState.scores.reduce((a, b) => a + b, 0);
            const correctCount = quizState.scores.filter(s => s > 0).length;

            soundFX.playFinish();
            triggerConfetti();

            // Prepare record object
            const record = {
                studentName: quizState.studentName,
                studentEmail: quizState.studentEmail,
                score: totalScore,
                accuracy: `${correctCount}/10`,
                date: new Date().toLocaleString('zh-CN')
            };

            // Save locally
            quizState.localHistory.push(record);

            // Save to Cloud via Firestore function
            if (window.saveQuizToCloud) {
                window.saveQuizToCloud(record);
            }

            container.innerHTML = `
                <div class="gf-card p-6 sm:p-10 space-y-8 bg-gradient-to-br from-white via-purple-50/30 to-indigo-50/40">
                    <div class="text-center space-y-3">
                        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-purple-100 text-purple-700 shadow-inner mb-2">
                            <i class="fa-solid fa-trophy text-4xl"></i>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800">Quiz Submitted! 🎉</h2>
                        <p class="text-xs sm:text-sm text-slate-600 font-medium">
                            Student: <strong class="text-purple-800">${quizState.studentName}</strong> (${quizState.studentEmail})
                        </p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
                        <div class="bg-white p-4 rounded-2xl border border-purple-200 shadow-sm text-center">
                            <span class="block text-xs font-bold uppercase tracking-wider text-slate-400">Total Score</span>
                            <span class="text-3xl sm:text-4xl font-extrabold text-purple-700">${totalScore}</span>
                            <span class="text-xs text-slate-400 block font-medium mt-0.5">/ 100 pts</span>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-purple-200 shadow-sm text-center">
                            <span class="block text-xs font-bold uppercase tracking-wider text-slate-400">Accuracy</span>
                            <span class="text-3xl sm:text-4xl font-extrabold text-green-600">${correctCount}</span>
                            <span class="text-xs text-slate-400 block font-medium mt-0.5">/ 10 Correct</span>
                        </div>
                    </div>

                    <div class="space-y-3 pt-4 border-t border-slate-200">
                        <h3 class="font-bold text-slate-800 text-sm sm:text-base flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-purple-600"></i> Answer Breakdown / 答题总览:
                        </h3>
                        <div class="grid grid-cols-1 gap-2 max-h-60 overflow-y-auto pr-1">
                            ${quizQuestions.map((q, idx) => {
                                const isCorr = quizState.scores[idx] > 0;
                                return `
                                    <div class="flex items-center justify-between p-3 rounded-xl ${isCorr ? 'bg-green-50/80 border border-green-200' : 'bg-red-50/80 border border-red-200'} text-xs sm:text-sm">
                                        <div class="flex items-center gap-2 truncate pr-2">
                                            <span class="font-bold ${isCorr ? 'text-green-800' : 'text-red-700'}">Q${q.id}.</span>
                                            <span class="truncate text-slate-700">${q.question}</span>
                                        </div>
                                        <span class="font-bold flex-shrink-0 ${isCorr ? 'text-green-700' : 'text-red-600'}">
                                            ${isCorr ? '+10 pts' : '0 pts'}
                                        </span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="pt-4 flex flex-col sm:flex-row justify-center gap-3">
                        <button type="button" onclick="resetQuiz()" class="w-full sm:w-auto px-8 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm rounded-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>Retake Quiz / 重新做题</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function resetQuiz() {
            soundFX.playClick();
            quizState.currentStep = 0;
            quizState.userAnswers.fill(null);
            quizState.confirmedAnswers.fill(false);
            quizState.scores.fill(0);
            renderStep();
        }

        function openTeacherModal() {
            soundFX.playClick();
            document.getElementById('teacher-modal').classList.remove('hidden');
            document.getElementById('teacher-login-view').classList.remove('hidden');
            document.getElementById('teacher-dashboard-view').classList.add('hidden');
            document.getElementById('teacher-pass-input').value = '';
            document.getElementById('teacher-pass-error').classList.add('hidden');
        }

        function closeTeacherModal() {
            soundFX.playClick();
            document.getElementById('teacher-modal').classList.add('hidden');
        }

        function authenticateTeacher() {
            const pass = document.getElementById('teacher-pass-input').value;
            const err = document.getElementById('teacher-pass-error');
            
            if (pass === '2020Hui%%') {
                soundFX.playCorrect();
                err.classList.add('hidden');
                document.getElementById('teacher-login-view').classList.add('hidden');
                document.getElementById('teacher-dashboard-view').classList.remove('hidden');
                loadTeacherDashboard();
            } else {
                soundFX.playWrong();
                err.classList.remove('hidden');
            }
        }

        async function loadTeacherDashboard() {
            const listEl = document.getElementById('teacher-records-list');
            listEl.innerHTML = '<p class="text-center text-slate-400 py-6">数据同步中...</p>';

            let cloudData = [];
            if (window.fetchCloudRecords) {
                cloudData = await window.fetchCloudRecords();
            }

            const allRecords = [...cloudData, ...quizState.localHistory];

            if (allRecords.length === 0) {
                listEl.innerHTML = '<p class="text-center text-slate-400 py-6">尚无提交记录。</p>';
                return;
            }

            listEl.innerHTML = allRecords.map((r) => `
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">
                    <div>
                        <span class="font-bold text-purple-900 block">${r.studentName || 'Unknown'}</span>
                        <span class="text-slate-500 font-mono text-[11px]">${r.studentEmail || '-'}</span>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-extrabold text-purple-700 bg-purple-100 px-2 py-0.5 rounded-md block">${r.score} 分</span>
                        <span class="text-[10px] text-slate-400">${r.date || 'Just now'}</span>
                    </div>
                </div>
            `).join('');
        }

        function logoutTeacher() {
            soundFX.playClick();
            closeTeacherModal();
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#673ab7', '#818cf8', '#10b981', '#f59e0b', '#ec4899'];

            for (let i = 0; i < 90; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 4 + 2,
                    angle: Math.random() * 360
                });
            }

            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.y += p.speed;
                    p.angle += 2;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.angle * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (pieces.some(p => p.y < canvas.height)) {
                    requestAnimationFrame(update);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            update();
        }

        // Initialize application once window is ready
        window.onload = function() {
            renderStep();
        };
    </script>
</body>
</html>
